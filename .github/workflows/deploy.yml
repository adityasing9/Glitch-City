name: Deploy Glitch City to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  export-web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config/godot
          if [ -d "/root/.local/share/godot/export_templates/4.3.stable" ]; then
            cp -r /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/
          fi
          if [ -d "/root/.config/godot" ]; then
            cp -r /root/.config/godot/* ~/.config/godot/ 2>/dev/null || true
          fi

      - name: Import and Export Web Project
        run: |
          mkdir -p build/web
          # Initialize project cache and class registry
          godot --headless --editor --quit || true
          # Export for web release
          godot --headless -v --export-release "Web" build/web/index.html
          # Include cross-origin service worker and headers
          cp coi-serviceworker.js build/web/
          if [ -f "_headers" ]; then
            cp _headers build/web/
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-pages:
    needs: export-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
